services:
  # Dev server with hot reload: docker compose up
  web:
    build: { context: ., target: dev }
    ports: ["3100:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - WATCHPACK_POLLING=true

  # Production build: docker compose --profile prod up --build prod
  prod:
    profiles: ["prod"]
    build: { context: ., target: runner }
    ports: ["3001:3000"]

volumes:
  node_modules:
  next_cache:
